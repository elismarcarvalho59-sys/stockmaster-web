<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster — Cadastrar produto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app" style="padding-bottom:24px">

    <header class="topo">
      <div class="linha1">
        <a class="marca" href="estoque.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
          Voltar
        </a>
      </div>
      <h1 id="titulo">Cadastrar produto</h1>
      <p id="subtitulo">Preencha os dados do novo item do estoque</p>
    </header>

    <main class="conteudo">
      <form id="form-produto" novalidate>

        <div class="campo" style="margin-top:4px">
          <label for="nome">Nome do produto</label>
          <input type="text" id="nome" maxlength="100" placeholder="ex.: Headset Gamer HyperX" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" required></select>
        </div>

        <div class="campo">
          <label for="preco">Preço de venda</label>
          <div class="prefixo">
            <span>R$</span>
            <input type="number" id="preco" min="0.01" step="0.01" placeholder="0,00" required>
          </div>
        </div>

        <div class="dupla">
          <div class="campo">
            <label for="estoque">Quantidade</label>
            <input type="number" id="estoque" min="0" step="1" placeholder="0" required>
          </div>
          <div class="campo">
            <label for="minimo">Estoque mínimo</label>
            <input type="number" id="minimo" min="0" step="1" placeholder="0" required>
          </div>
        </div>

        <div class="card aviso">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <p>Quando a quantidade em estoque ficar igual ou abaixo do mínimo, o produto
             aparecerá nos <b>Alertas de Estoque</b> do Dashboard.</p>
        </div>

        <div id="erro" class="msg-erro oculto" role="alert"></div>

        <button type="submit" class="btn-grad" style="margin-top:20px">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>
          <span id="texto-botao">Salvar produto</span>
        </button>

        <a class="btn-texto" href="estoque.html" style="margin-bottom:28px">Cancelar</a>

      </form>
    </main>
  </div>

  <script src="js/banco.js"></script>
  <script src="js/app.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
